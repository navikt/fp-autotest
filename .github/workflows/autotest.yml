name: Utfører tester mot SUT
on:
  workflow_call:
    secrets:
      NAIS_WORKLOAD_IDENTITY_PROVIDER:
        description: 'Identity provider for NAIS workload identity (brukes ved innlogging mot GAR)'
        required: true
    inputs:
      build-version:
        description: 'Docker tag (from repository)'
        type: string
        required: false
        default: 'latest'
      parallellitet:
        description: 'Ønsket parallelitet ved kjøring'
        type: string
        required: false
        default: '8'
      test-suite:
        description: 'Test suite å kjøre (fpsak|fptilbake|fpkalkulus|fplos|verdikjede)'
        type: string
        required: true
    outputs:
      resultat:
        description: "Test resultat"
        value: ${{ jobs.autotest.outputs.result }}
jobs:
  autotest:
    name: Kjører ${{ inputs.test-suite }}-tester mot ${{ github.repository }} ${{ inputs.build-version }}
    permissions:
      contents: read
      id-token: write
    runs-on: ${{ ((github.actor == 'dependabot[bot]' || inputs.test-suite == 'fpkalkulus' || inputs.test-suite == 'fplos') && 'ubuntu-latest') || 'ubuntu-latest-8-cores' }}
    timeout-minutes: 15
    outputs:
      result: ${{ steps.result.outputs.result }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}
      TEST_SUITE: ${{ inputs.test-suite }}
      PARALLELLITET: ${{ inputs.parallellitet }}
      BUILD_VERSION: ${{ inputs.build-version }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        if: github.repository == 'navikt/fp-autotest'
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        if: github.repository != 'navikt/fp-autotest'
        with:
          repository: 'navikt/fp-autotest'
          ref: 'master'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # ratchet:actions/setup-java@v5.7.0
        with:
          distribution: 'temurin'
          java-version: 25
      - name: Cache for maven dependencies autotest
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-autotest-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-autotest
      - name: Login GAR
        uses: nais/login@40b72a35a18ddf2ad74b632461139ab838cc2a2f # ratchet:nais/login@v0
        with:
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
          team: teamforeldrepenger
      - name: Setup keystore
        shell: bash
        working-directory: pipeline/keystore
        run: ./make-dummy-keystore.sh
      - name: Setup fpsak og dens avhengigheter
        id: setup
        shell: bash
        working-directory: pipeline
        run: |
          if [[ "$TEST_SUITE" == 'fpkalkulus' ]]; then
            services=("fpkalkulus")
          elif [[ "$TEST_SUITE" == 'fplos' ]]; then
            services=("fplos" "fpsak" "fpformidling" "fpdokgen" "fpoppdrag" "fptilbake" "fprisk" "fpmottak" "fpsoknad" "fpkalkulus" "fpinntektsmelding" "fpinntektsmeldingapi")
          else
            services=("fpsak" "fpformidling" "fpdokgen" "fpoppdrag" "fptilbake" "fprisk" "fpmottak" "fpsoknad" "fpoversikt" "fpkalkulus" "fpinntektsmelding" "fpinntektsmeldingapi")
          fi

          ./update-versions.sh "$REPO" "$BUILD_VERSION"
          echo "Kjører docker compose up på følgende applikasjoner: ${services[*]}"
          docker compose -f compose.yml -f compose-github.yml pull --quiet "${services[@]}"
          docker stop $(docker ps -a -q) || docker rm $rm $(docker ps -a -q)
          docker compose -f compose.yml -f compose-github.yml up --wait "${services[@]}" || (docker ps ; echo "Oppstart feilet. Se etter tjenester som er \"unhealthy\" eller \"restarting\" i listen over." ; exit 1)
      - name: Utfører tester fra test suite ${{ inputs.test-suite }} mot SUT
        id: tester
        shell: bash
        run: mvn test -e --batch-mode -Djuipter.parallelism="$PARALLELLITET" -P "$TEST_SUITE" > >(tee test-result-log.txt)
      - name: Sjekker loggen etter feil
        if: (success() || failure()) && steps.setup.outcome == 'success'
        id: logger
        shell: bash
        run: |
          if [[ "$TEST_SUITE" == 'fptilbake' ]]; then
            mvn test -e --batch-mode -Djuipter.parallelism="$PARALLELLITET" -P loggfeil -DikkeSjekkLengdeAvContainer=fpdokgen,fpoppdrag
          elif [[ "$TEST_SUITE" == 'verdikjede' ]]; then
            mvn test -e --batch-mode -Djuipter.parallelism="$PARALLELLITET" -P logger -DikkeSjekkLengdeAvContainer=fpdokgen
          elif [[ "$TEST_SUITE" == 'fplos' ]]; then
            mvn test -e --batch-mode -Djuipter.parallelism="$PARALLELLITET" -P logger -DikkeSjekkLengdeAvContainer=fpdokgen,fpoppdrag
          elif [[ "$TEST_SUITE" == 'fpsak' ]]; then
            mvn test -e --batch-mode -Djuipter.parallelism="$PARALLELLITET" -P logger -DikkeSjekkLengdeAvContainer=fpdokgen
          else
            mvn test -e --batch-mode -Djuipter.parallelism="$PARALLELLITET" -P loggfeil
          fi
      - name: Sjekker minneforbruk
        if: failure() || cancelled()
        run: |
          docker stats --no-stream
          free -m
      - name: Utled testresultat
        if: (success() || failure()) && steps.setup.outcome == 'success'
        id: result
        shell: bash
        run: |
          if [[ ${{ steps.setup.outcome }} == 'success' ]]; then
            echo "result=test-${{ steps.tester.outcome }} logg-${{ steps.logger.outcome }}" >> $GITHUB_OUTPUT
          else
            echo "result=skipped" >> $GITHUB_OUTPUT
          fi

      - name: Dumper logger for feilsøking
        if: failure() || cancelled()
        shell: bash
        run: |
          mkdir container-logs
          cd container-logs
          docker ps -a --format '{{.Names}}' | while read pod; do docker logs $pod > $pod.log 2>&1; done
      - name: Laste opp logger
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7.0.1
        with:
          name: logs-${{ inputs.test-suite }}
          path: container-logs
