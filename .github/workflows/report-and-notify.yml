name: Report and notify about testresults
on:
  workflow_call:
    secrets:
      SLACK_WEBHOOK:
        description: 'Webhook-URL for Slack-kanalen der testresultatene varsles'
        required: true
    inputs:
      build-version:
        required: false
        type: string
        description: 'Docker tag (from repository)'
        default: 'latest'
      fpsak:
        required: false
        type: string
        description: "Resultat av kjøring av test suite (skipped|test-failure|logg-failure|success)"
        default: 'skipped'
      fptilbake:
        required: false
        type: string
        description: "Fptilbake resultat tester"
        default: 'skipped'
      fpkalkulus:
        required: false
        type: string
        description: "Fpkalkulus resultat tester"
        default: 'skipped'
      fplos:
        required: false
        type: string
        description: "Fplos resultat tester"
        default: 'skipped'
      verdikjede:
        required: false
        type: string
        description: "Verdikjede resultat tester"
        default: 'skipped'

jobs:
  notify-slack:
    name: Notify slack om testresultat
    permissions:
      contents: read
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 2
    env:
      BUILD_VERSION: ${{ inputs.build-version }}
      FPSAK: ${{ inputs.fpsak }}
      FPTILBAKE: ${{ inputs.fptilbake }}
      FPKALKULUS: ${{ inputs.fpkalkulus }}
      FPLOS: ${{ inputs.fplos }}
      VERDIKJEDE: ${{ inputs.verdikjede }}
    steps:
      - name: Henter ut historie til trigger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          # Beholder credentials fordi neste steg gjor `git fetch` mot repoet,
          # noe som krever autentisering for private/interne repoer.
          persist-credentials: true
          repository: ${{ github.repository }}
          path: ${{ github.repository }}
          fetch-depth: 5
      - name: Hent ut versjon fra forrige issue
        run: |
          CURRENT_HASH=$(echo "$BUILD_VERSION" | awk -F'-' '{print $3}')
          cd "${{ github.repository }}"
          git remote -v
          git fetch
          echo "DIFFERANSE=$(git log --pretty=format:"%s; author: %an" -n 1 ${CURRENT_HASH})" >> $GITHUB_ENV
      - name: Bygger opp slack melding
        run: |
          function statusJobb() {
            if [[ "$1" == *"skipped"* ]]; then
              echo "skipped"
            elif [[ "$1" == *"test-failure"* || -z "$1" ]]; then
              echo "test-feil"
            elif [[ "$1" == *"test-success"* && "$2" == *"logg-failure"* ]]; then
              echo "logg-feil"
            else
              echo "success"
            fi
          }

          function echoStatus() {
            if [[ "$2" == 'skipped' ]]; then
              echo ":heavy_minus_sign:  $1"
            elif [[ "$2" == 'success' ]]; then
              echo ":heavy_check_mark:  $1"
            else
              echo ":x:  $1"
            fi
          }

          fpsakStatus="$(statusJobb $FPSAK)"
          fptilbakeStatus="$(statusJobb $FPTILBAKE)"
          fpkalkulustestStatus="$(statusJobb $FPKALKULUS)"
          fplosStatus="$(statusJobb $FPLOS)"
          verdikjedetestStatus="$(statusJobb $VERDIKJEDE)"

          echo 'SLACK_MESSAGE<<\n' >> $GITHUB_ENV
          echo >> $GITHUB_ENV
          echoStatus Fpsak $fpsakStatus >> $GITHUB_ENV
          echoStatus Fptilbake $fptilbakeStatus >> $GITHUB_ENV
          echoStatus Kalkulus $fpkalkulustestStatus >> $GITHUB_ENV
          echoStatus Fplos $fplosStatus >> $GITHUB_ENV
          echoStatus Verdikjedetester $verdikjedetestStatus >> $GITHUB_ENV

          echo >> $GITHUB_ENV
          echo "*Trigger*: ${{ github.repository }}:${BUILD_VERSION}" >> $GITHUB_ENV
          echo "*Endringer*: ${DIFFERANSE}" >> $GITHUB_ENV
          echo '*Action URL*: <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|Github Action Url>' >> $GITHUB_ENV
          echo '\n' >> $GITHUB_ENV

          if [[ $fpsakStatus == 'test-feil' || $fptilbakeStatus == 'test-feil' || $verdikjedetestStatus == 'test-feil' || $fpkalkulustestStatus == 'test-feil' || $fplosStatus == 'test-feil' ]]; then
            echo "Test failure!"
            echo "SLACK_TITLE=Verdikjeden er brukket :boom:" >> $GITHUB_ENV
            echo "SLACK_COLOR=#df1515" >> $GITHUB_ENV
          elif [[ $fpsakStatus == 'logg-feil'|| $fptilbakeStatus == 'logg-feil' || $verdikjedetestStatus == 'logg-feil' || $fpkalkulustestStatus == 'logg-feil' || $fplosStatus == 'logg-feil' ]]; then
            echo "Feil i loggen, men testene kjørte OK!"
            echo "SLACK_TITLE=Testene gikk grønne, men fant feil i loggen :bug:" >> $GITHUB_ENV
            echo "SLACK_COLOR=#ffff00" >> $GITHUB_ENV
          else
            echo "Test success!"
            echo "SLACK_TITLE=Verdikjeden er kjørt UTEN feil :rocket:" >> $GITHUB_ENV
            echo "SLACK_COLOR=#37df1d" >> $GITHUB_ENV
          fi
      - name: Slack Notification
        if: success()
        uses: rtCamp/action-slack-notify@33ca3be66c6f378fe1610fd1d5258632dbed5e58 # ratchet:rtCamp/action-slack-notify@v2.4.0
        env:
          SLACK_CHANNEL: vtp-autotest-resultat
          SLACK_COLOR: ${{ env.SLACK_COLOR }}
          SLACK_ICON: https://github.com/github.png?size=48
          SLACK_TITLE: ${{ env.SLACK_TITLE }}
          SLACK_MESSAGE: ${{ env.SLACK_MESSAGE }}
          SLACK_USERNAME: Github Action
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_FOOTER: ''
          MSG_MINIMAL: true
      - name: Slack Notification
        if: failure()
        uses: rtCamp/action-slack-notify@33ca3be66c6f378fe1610fd1d5258632dbed5e58 # ratchet:rtCamp/action-slack-notify@v2.4.0
        env:
          SLACK_CHANNEL: vtp-autotest-resultat
          SLACK_COLOR: #df1515
          SLACK_ICON: https://github.com/github.png?size=48
          SLACK_TITLE: 'Klarte ikke generere slack-melding!'
          SLACK_MESSAGE: 'Sjekk hva som skjedde på Github -> *Action URL*: <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|Github Action Url>'
          SLACK_USERNAME: Github Action
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_FOOTER: ''
          MSG_MINIMAL: true
