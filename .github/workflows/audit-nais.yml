name: Build and deploy nais.audit
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'pipeline/audit.nais/Dockerfile'
      - '.github/workflows/audit-nais.yml'
jobs:
  build:
    name: Build audit.nais mock
    permissions:
      contents: read
      packages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # ratchet:docker/setup-qemu-action@v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # ratchet:docker/setup-buildx-action@v4.4.1
      - name: NAIS login
        uses: nais/login@40b72a35a18ddf2ad74b632461139ab838cc2a2f # ratchet:nais/login@v0
        id: login
        with:
          team: teamforeldrepenger
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # ratchet:docker/build-push-action@v7.4.0
        with:
          context: pipeline/audit.nais
          platforms: linux/amd64, linux/arm64
          pull: true
          push: true
          tags: ${{ steps.login.outputs.registry }}/${{ github.repository }}/audit-nais-mock:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
